<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MapTap · Globe</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #070b1c; --bg-2: #0a1030; --panel: rgba(16,22,52,.92); --border: rgba(130,155,255,.16);
    --text: #eaf0ff; --muted: #98a4d4; --cyan: #22d3ee;
    --body: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; color: var(--text); font: 15px/1.5 var(--body);
    background: radial-gradient(1200px 800px at 50% -5%, var(--bg-2), var(--bg) 70%); }
  #globe { position: fixed; inset: 0; }
  .top { position: fixed; top: 0; left: 0; right: 0; padding: 14px 18px; display: flex; gap: 12px;
    align-items: baseline; z-index: 2; pointer-events: none; }
  .top a { color: var(--muted); text-decoration: none; font-family: var(--mono); font-size: .95rem; pointer-events: auto; }
  .top a:hover { color: var(--cyan); }
  .top h1 { font-family: var(--mono); font-size: 1rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--cyan); margin: 0; text-shadow: 0 2px 12px rgba(7,11,28,.9); }
  #status { position: fixed; left: 18px; bottom: 18px; z-index: 2; background: var(--panel);
    border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; font-size: .9rem; }
  #status b { display: block; font-size: 1.05rem; }
  #status:empty { display: none; }
  .credit { position: fixed; right: 8px; bottom: 6px; z-index: 2; color: rgba(152,164,212,.55);
    font: .65rem var(--mono); pointer-events: none; }
</style>
</head>
<body>
<div class="top"><a href="/">← Scoreboard</a><h1>Where we're from</h1></div>
<div id="globe"></div>
<div id="status"></div>
<div class="credit">Imagery © Esri &amp; contributors</div>
<script type="module">
// ?deps pins the ENTIRE dependency graph to one three.js copy — mixed copies
// (which jsdelivr's +esm produces) silently break the tile textures.
import Globe from 'https://esm.sh/globe.gl@2.46.2?deps=three@0.185.1';
import { CanvasTexture, Sprite, SpriteMaterial, SRGBColorSpace }
  from 'https://esm.sh/three@0.185.1';

const status = document.getElementById('status');

// Card drawn onto a canvas texture and mounted as a sprite IN the 3D scene, so it
// moves in perfect sync with the globe (DOM overlays lag a frame behind the WebGL render).
// Palette mirrors the site tokens above — keep them in step with scoreboard.html.
function cardSprite(p) {
  const S = 4; // supersample for crisp text
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const name = p.label;
  const place = [p.city, p.country].filter(Boolean).join(' · ');
  const fName = `700 ${17 * S}px Inter, -apple-system, "Segoe UI", sans-serif`;
  const fPlace = `${12 * S}px ui-monospace, "SFMono-Regular", Menlo, monospace`;
  ctx.font = fName; const w1 = ctx.measureText(name).width;
  ctx.font = fPlace; const w2 = ctx.measureText(place).width;

  const pad = 13 * S, r = 10 * S;
  const cardW = Math.max(w1, w2) + pad * 2;
  const cardH = (place ? 52 : 34) * S;
  const stemH = 10 * S, dotR = 5 * S;
  c.width = Math.ceil(cardW + 4 * S);
  c.height = cardH + stemH + dotR * 2 + 4 * S;
  const x = 2 * S, y = 2 * S, cx = c.width / 2;

  // glass panel + border
  ctx.fillStyle = 'rgba(16,22,52,.94)';
  ctx.strokeStyle = 'rgba(130,155,255,.5)';
  ctx.lineWidth = 1.5 * S;
  ctx.beginPath();
  ctx.roundRect(x, y, cardW, cardH, r);
  ctx.fill(); ctx.stroke();
  // stem pointing at the spot
  ctx.fillStyle = 'rgba(130,155,255,.5)';
  ctx.beginPath();
  ctx.moveTo(cx - 6 * S, y + cardH - S);
  ctx.lineTo(cx + 6 * S, y + cardH - S);
  ctx.lineTo(cx, y + cardH + stemH);
  ctx.fill();
  // glowing anchor dot on the exact location
  ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 8 * S;
  ctx.fillStyle = '#22d3ee';
  ctx.beginPath();
  ctx.arc(cx, c.height - dotR - S, dotR, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // text: bright name, softly dimmed place line (stays ≥4.5:1 on the panel)
  ctx.textAlign = 'center';
  ctx.fillStyle = '#eaf0ff';
  ctx.font = fName;
  ctx.fillText(name, cx, y + 22 * S);
  if (place) {
    ctx.fillStyle = '#b9c5ec';
    ctx.font = fPlace;
    ctx.fillText(place, cx, y + 41 * S);
  }

  const tex = new CanvasTexture(c);
  tex.colorSpace = SRGBColorSpace;
  const spr = new Sprite(new SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  spr.center.set(0.5, 0); // anchor the dot, not the card, on the coordinates
  const h = 11; // world units (globe radius is 100) — sprites shrink/grow with zoom
  spr.scale.set(h * c.width / c.height, h, 1);
  return spr;
}

const globe = Globe()(document.getElementById('globe'))
  .backgroundColor('rgba(0,0,0,0)')
  // satellite map tiles: higher-resolution tiles load automatically as you zoom in
  .globeTileEngineUrl((x, y, l) =>
    `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${l}/${y}/${x}`)
  .showAtmosphere(true)
  .atmosphereColor('#22d3ee')
  .atmosphereAltitude(0.16)
  .objectThreeObject(cardSprite)
  .objectAltitude(0.012)
  .onObjectClick((p) => globe.pointOfView({ lat: p.lat, lng: p.lng, altitude: 1.2 }, 800));

// gentle spin until the first touch — then it's all yours
globe.controls().autoRotate = true;
globe.controls().autoRotateSpeed = 0.55;
document.getElementById('globe').addEventListener('pointerdown',
  () => { globe.controls().autoRotate = false; }, { once: true });

fetch('/api/globe').then((r) => r.json()).then(({ layers }) => {
  const points = layers.flatMap((l) => l.points.map((p) => ({ ...p, layer: l.id })));
  globe.objectsData(points);
  if (!points.length) status.innerHTML = '<b>Nobody here yet</b>add birth cities on /users';
}).catch(() => { status.innerHTML = '<b>Could not load players</b>'; });

function fit() { globe.width(innerWidth).height(innerHeight); }
fit();
addEventListener('resize', fit);
</script>
</body>
</html>
