<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MapTap · Globe</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #070b1c; --bg-2: #0a1030; --panel: rgba(16,22,52,.92); --border: rgba(130,155,255,.16);
    --text: #eaf0ff; --muted: #98a4d4; --cyan: #22d3ee;
    --body: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; color: var(--text); font: 15px/1.5 var(--body);
    background: radial-gradient(1200px 800px at 50% -5%, var(--bg-2), var(--bg) 70%); }
  #globe { position: fixed; inset: 0; }
  .top { position: fixed; top: 0; left: 0; right: 0; padding: 14px 18px; display: flex; gap: 12px;
    align-items: baseline; z-index: 2; pointer-events: none; }
  .top a { color: var(--muted); text-decoration: none; font-family: var(--mono); font-size: .95rem; pointer-events: auto; }
  .top a:hover { color: var(--cyan); }
  .top h1 { font-family: var(--mono); font-size: 1rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--cyan); margin: 0; text-shadow: 0 2px 12px rgba(7,11,28,.9); }

  /* player marker: small glowing dot, generous invisible hitbox, name tag on hover */
  .mark { position: relative; width: 16px; height: 16px; border-radius: 50%; cursor: pointer;
    background: var(--cyan); border: 2px solid #fff; box-shadow: 0 0 12px var(--cyan), 0 0 4px rgba(0,0,0,.6);
    transition: transform .15s; }
  .mark::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; } /* 44px hitbox */
  .mark:hover { transform: scale(1.35); }
  .mark .tag { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); display: none;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 3px 9px;
    font: .8rem var(--mono); white-space: nowrap; }
  .mark:hover .tag { display: block; }

  #card { position: fixed; left: 18px; bottom: 18px; z-index: 2; background: var(--panel);
    border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; min-width: 200px; max-width: 300px;
    box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  #card .who { font-weight: 700; font-size: 1.2rem; margin-bottom: 4px; }
  #card .row { display: flex; gap: 8px; align-items: baseline; font-size: .9rem; color: var(--muted); }
  #card .row b { color: var(--text); font-weight: 600; }
  #card .k { font: .68rem var(--mono); text-transform: uppercase; letter-spacing: .1em; width: 58px; flex: none; }
  #card:empty { display: none; }

  .credit { position: fixed; right: 8px; bottom: 6px; z-index: 2; color: rgba(152,164,212,.55);
    font: .65rem var(--mono); pointer-events: none; }
</style>
</head>
<body>
<div class="top"><a href="/">← Scoreboard</a><h1>Where we're from</h1></div>
<div id="globe"></div>
<div id="card"></div>
<div class="credit">Imagery © Esri &amp; contributors</div>
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
<script>
const card = document.getElementById('card');

function marker(p) {
  const el = document.createElement('div');
  el.className = 'mark';
  el.innerHTML = `<span class="tag"></span>`;
  el.querySelector('.tag').textContent = p.label;
  el.style.pointerEvents = 'auto';
  el.onclick = (e) => {
    e.stopPropagation();
    card.innerHTML = `<div class="who"></div>
      <div class="row"><span class="k">City</span><b class="c1"></b></div>
      <div class="row"><span class="k">Country</span><b class="c2"></b></div>`;
    card.querySelector('.who').textContent = p.label;
    card.querySelector('.c1').textContent = p.city || '—';
    card.querySelector('.c2').textContent = p.country || '—';
    globe.pointOfView({ lat: p.lat, lng: p.lng, altitude: 1.2 }, 800);
  };
  return el;
}

var globe = Globe()(document.getElementById('globe'))
  .backgroundColor('rgba(0,0,0,0)')
  // satellite map tiles: higher-resolution tiles load automatically as you zoom in
  .globeTileEngineUrl((x, y, l) =>
    `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${l}/${y}/${x}`)
  .showAtmosphere(true)
  .atmosphereColor('#22d3ee')
  .atmosphereAltitude(0.16)
  .htmlElement(marker)
  .htmlAltitude(0.008);

// gentle spin until the first touch — then it's all yours
globe.controls().autoRotate = true;
globe.controls().autoRotateSpeed = 0.55;
document.getElementById('globe').addEventListener('pointerdown',
  () => { globe.controls().autoRotate = false; }, { once: true });

fetch('/api/globe').then((r) => r.json()).then(({ layers }) => {
  const points = layers.flatMap((l) => l.points.map((p) => ({ ...p, layer: l.id })));
  globe.htmlElementsData(points);
  if (!points.length) card.innerHTML = '<div class="who">Nobody here yet</div><div class="row">add birth cities on /users</div>';
}).catch(() => { card.innerHTML = '<div class="who">Could not load players</div>'; });

function fit() { globe.width(innerWidth).height(innerHeight); }
fit();
addEventListener('resize', fit);
</script>
</body>
</html>
