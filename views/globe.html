<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MapTap · Globe</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.6.0/dist/maplibre-gl.css">
<style>
  :root {
    color-scheme: dark;
    --bg: #070b1c; --bg-2: #0a1030; --panel: rgba(16,22,52,.92); --border: rgba(130,155,255,.16);
    --text: #eaf0ff; --muted: #98a4d4; --cyan: #22d3ee;
    --body: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; color: var(--text); font: 15px/1.5 var(--body);
    background: radial-gradient(1200px 800px at 50% -5%, var(--bg-2), var(--bg) 70%); }
  #map { position: fixed; inset: 0; background: transparent; }
  #lines { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .top { position: fixed; top: 0; left: 0; right: 0; padding: 14px 18px; display: flex; gap: 12px;
    align-items: baseline; z-index: 3; pointer-events: none; }
  .top a { color: var(--muted); text-decoration: none; font-family: var(--mono); font-size: .95rem; pointer-events: auto; }
  .top a:hover { color: var(--cyan); }
  .top h1 { font-family: var(--mono); font-size: 1rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--cyan); margin: 0; text-shadow: 0 2px 12px rgba(7,11,28,.9); }
  #status { position: fixed; left: 18px; bottom: 18px; z-index: 3; background: var(--panel);
    border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; font-size: .9rem; }
  #status b { display: block; font-size: 1.05rem; }
  #status:empty { display: none; }
  .credit { position: fixed; right: 8px; bottom: 6px; z-index: 3; color: rgba(152,164,212,.8);
    font: .7rem var(--mono); pointer-events: none; }

  /* player card (a MapLibre marker element; the leader line points to the birthplace dot) */
  .pcard { background: var(--panel); border: 1px solid rgba(130,155,255,.5); border-radius: 10px;
    padding: 5px 12px 6px; text-align: center; cursor: pointer; white-space: nowrap;
    box-shadow: 0 4px 18px rgba(0,0,0,.45); }
  .pcard:hover { border-color: rgba(34,211,238,.6); }
  .pcard .nm { font: 700 .92rem/1.35 var(--body); }
  .pcard .pl { font: .7rem/1.4 var(--mono); color: #b9c5ec; }
  .pcard.mini { border-radius: 999px; padding: 3px 11px; }
  .pcard.mini .nm { font-size: .78rem; }
  .pcard.mini .pl { display: none; }

  /* story panel (opens on card click) */
  #panel { position: fixed; top: 60px; right: 14px; bottom: 14px; z-index: 4; width: min(340px, calc(100vw - 28px));
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px;
    overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #panel[hidden] { display: none; }
  #panel .close { position: sticky; top: 0; float: right; background: rgba(7,11,28,.75); border: 1px solid var(--border);
    border-radius: 8px; color: var(--muted); cursor: pointer; font-size: 1rem; min-width: 36px; min-height: 36px; }
  #panel .close:hover { color: var(--cyan); }
  #panel h2 { font: 700 1.05rem/1.3 var(--body); margin: 0 0 2px; }
  #panel .place { font: .75rem var(--mono); color: var(--muted); margin: 0 0 8px; }
  #panel .story { font-size: .88rem; margin: 0 0 10px; white-space: pre-wrap; }
  #panel img { width: 100%; border-radius: 10px; border: 1px solid var(--border); display: block; }
  #panel .cap { font: .75rem var(--mono); color: var(--muted); margin: 4px 0 12px; }
  #panel .person + .person { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 14px; }
</style>
</head>
<body>
<div class="top"><a href="/">← Scoreboard</a><h1>Where we're from</h1></div>
<div id="map"></div>
<svg id="lines"></svg>
<div id="status"></div>
<div id="panel" hidden><button class="close" title="Close" aria-label="Close">✕</button><div id="pbody"></div></div>
<div class="credit">Imagery © Esri &amp; contributors · MapLibre</div>
<script type="module">
import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.6.0/dist/maplibre-gl.mjs';

const status = document.getElementById('status');
const svg = document.getElementById('lines');
const panel = document.getElementById('panel');
const pbody = document.getElementById('pbody');
panel.querySelector('.close').addEventListener('click', () => { panel.hidden = true; });

// All content is untrusted user text — build with createElement/textContent, never innerHTML.
function openPanel(g) {
  pbody.replaceChildren(...g.people.map((p) => {
    const d = document.createElement('div');
    d.className = 'person';
    const add = (tag, cls, text) => {
      const el = document.createElement(tag);
      el.className = cls; el.textContent = text;
      d.appendChild(el); return el;
    };
    add('h2', '', p.label);
    add('p', 'place', [p.city, p.country].filter(Boolean).join(' · '));
    if (p.story) add('p', 'story', p.story);
    for (const ph of p.photos || []) {
      const img = document.createElement('img');
      img.src = `/uploads/${ph.file}`; img.alt = ph.caption || p.label; img.loading = 'lazy';
      d.appendChild(img);
      add('p', 'cap', ph.caption || '');
    }
    return d;
  }));
  panel.hidden = false;
}

const map = new maplibregl.Map({
  container: 'map',
  attributionControl: false, // the .credit line carries the Esri notice
  minZoom: 1,
  maxZoom: 17,
  center: [10, 35],
  zoom: 1.8,
  style: {
    version: 8,
    projection: { type: 'globe' },
    sources: {
      sat: {
        type: 'raster',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256,
        maxzoom: 17,
        attribution: 'Imagery © Esri & contributors',
      },
    },
    layers: [{ id: 'sat', type: 'raster', source: 'sat' }],
    sky: {
      'sky-color': '#02040f',
      'horizon-color': '#0e5d7a',
      'fog-color': '#070b1c',
      'sky-horizon-blend': 0.6,
      'horizon-fog-blend': 0.6,
      'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 6, 1, 8, 0.1],
    },
  },
});
window.map = map; // console/debug handle

// gentle spin until the first touch — then it's all yours (off for reduced motion)
let spinning = !matchMedia('(prefers-reduced-motion: reduce)').matches;
const stopSpin = () => { spinning = false; };
for (const ev of ['mousedown', 'touchstart', 'wheel']) map.on(ev, stopSpin);
function spin() {
  if (!spinning || map.getZoom() > 4) return;
  const c = map.getCenter();
  map.easeTo({ center: [c.lng + 10, c.lat], duration: 2500, easing: (n) => n });
}
map.on('moveend', () => spin());

const MINI = 4;      // below this zoom cards shrink to name-only chips
const LIMB = 78;     // degrees from view center beyond which a point is over the horizon
let groups = [];

const rad = Math.PI / 180;
function degFromCenter(g) {
  const c = map.getCenter();
  const x = Math.sin(c.lat * rad) * Math.sin(g.lat * rad)
    + Math.cos(c.lat * rad) * Math.cos(g.lat * rad) * Math.cos((g.lng - c.lng) * rad);
  return Math.acos(Math.min(1, Math.max(-1, x))) / rad;
}

// Every card stays visible: start above its dot, then push overlapping cards
// apart in screen space. The SVG leader line keeps pointing at the birthplace.
function layout() {
  const mini = map.getZoom() < MINI;
  const flat = map.getZoom() > 5.5; // zoomed in far enough that the horizon can't hide anyone
  for (const g of groups) {
    g.el.classList.toggle('mini', mini);
    g.vis = flat || degFromCenter(g) < LIMB;
    g.el.style.display = g.vis ? '' : 'none';
    if (!g.vis) continue;
    g.p = map.project([g.lng, g.lat]);
    g.w = g.el.offsetWidth + 10; g.h = g.el.offsetHeight + 8; // padding = breathing room
    g.x = g.p.x; g.y = g.p.y - g.el.offsetHeight / 2 - 14;    // resting spot: above the dot
  }
  const vis = groups.filter((g) => g.vis);
  for (let it = 0; it < 30; it++) {
    let moved = false;
    for (let a = 0; a < vis.length; a++) for (let b = a + 1; b < vis.length; b++) {
      const A = vis[a], B = vis[b];
      const dx = B.x - A.x, dy = B.y - A.y;
      const ox = (A.w + B.w) / 2 - Math.abs(dx), oy = (A.h + B.h) / 2 - Math.abs(dy);
      if (ox <= 0 || oy <= 0) continue;
      moved = true;
      if (ox < oy) { const s = (dx >= 0 ? 1 : -1) * ox / 2; A.x -= s; B.x += s; }
      else { const s = (dy >= 0 ? 1 : -1) * oy / 2; A.y -= s; B.y += s; }
    }
    if (!moved) break;
  }
  let lines = '';
  for (const g of vis) {
    g.marker.setOffset([g.x - g.p.x, g.y - g.p.y]);
    lines += `<line x1="${g.p.x}" y1="${g.p.y}" x2="${g.x}" y2="${g.y}"
      stroke="rgba(34,211,238,.55)" stroke-width="1.5"/>`;
  }
  svg.innerHTML = lines;
}

map.on('load', async () => {
  try {
    const { layers } = await (await fetch('/api/globe')).json();
    const points = layers.flatMap((l) => l.points);
    if (!points.length) {
      status.innerHTML = '<b>Nobody here yet</b>add birth cities on /users';
      return;
    }
    // players in the same spot share one card ("Ana & Ben")
    const byCoord = new Map();
    for (const p of points) {
      const k = `${p.lat},${p.lng}`;
      if (!byCoord.has(k)) byCoord.set(k, { ...p, names: [], people: [] });
      byCoord.get(k).names.push(p.label);
      byCoord.get(k).people.push(p);
    }
    groups = [...byCoord.values()];

    // glowing dot on each exact birthplace (map layer: occluded by the horizon for free)
    map.addSource('players', { type: 'geojson', data: {
      type: 'FeatureCollection',
      features: groups.map((g) => ({
        type: 'Feature', geometry: { type: 'Point', coordinates: [g.lng, g.lat] }, properties: {},
      })),
    } });
    map.addLayer({ id: 'dots', type: 'circle', source: 'players', paint: {
      'circle-radius': 4.5, 'circle-color': '#22d3ee',
      'circle-stroke-color': '#ffffff', 'circle-stroke-width': 1.5,
    } });

    for (const g of groups) {
      const el = document.createElement('div');
      el.className = 'pcard';
      el.innerHTML = '<div class="nm"></div><div class="pl"></div>';
      el.querySelector('.nm').textContent = g.names.join(' & ');
      el.querySelector('.pl').textContent = [g.city, g.country].filter(Boolean).join(' · ');
      el.addEventListener('click', () => {
        stopSpin();
        map.flyTo({ center: [g.lng, g.lat], zoom: Math.max(map.getZoom(), 5.5), duration: 1200 });
        openPanel(g);
      });
      g.el = el;
      g.marker = new maplibregl.Marker({ element: el, anchor: 'center' })
        .setLngLat([g.lng, g.lat]).addTo(map);
    }
    map.on('move', layout);
    map.on('resize', layout);
    layout();
    spin();
  } catch {
    status.innerHTML = '<b>Could not load players</b>';
  }
});
</script>
</body>
</html>
