name: deploy

# SSHes into the personal-cloud server and runs the same command you'd run by
# hand: git pull + rebuild. No registry, no image push — the server owns the
# repo and Docker Compose, Actions just triggers it.

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you re-deploy from the Actions tab without a push

concurrency:
  group: deploy           # a newer push cancels an in-flight deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host keys, not ssh-keyscan: a keyscan trusts whatever answers on
          # the run, so it would authenticate a machine-in-the-middle just as happily
          # as the real box. If the server is ever rebuilt its host keys change and
          # this step fails loudly — refresh the DEPLOY_KNOWN_HOSTS secret then.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_DIR' && git pull --ff-only && docker compose up -d --build"
